<title>企画ダッシュボード</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    --bg: #f5f5f2;
    --surface: #ffffff;
    --surface-2: #eeede6;
    --text: #17160f;
    --text-secondary: #57554c;
    --text-muted: #8c897d;
    --border: rgba(23,22,15,0.11);
    --border-strong: rgba(23,22,15,0.22);
    --shadow: 0 1px 2px rgba(23,22,15,0.04), 0 8px 20px -14px rgba(23,22,15,0.22);
    --accent: #6849c9; --accent-soft: #e6ddf9;
    --pdf: #b0392b; --pdf-soft: #fbe1dc;
    --ppt: #c9540c; --ppt-soft: #f8e2d1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16150f; --surface: #1f1e17; --surface-2: #28261d;
      --text: #f1efe6; --text-secondary: #c2bfb2; --text-muted: #918e80;
      --border: rgba(241,239,230,0.13); --border-strong: rgba(241,239,230,0.24);
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 20px -14px rgba(0,0,0,0.6);
      --accent: #a68af0; --accent-soft: #332a4d;
      --pdf: #e3897c; --pdf-soft: #45241e;
      --ppt: #f0925a; --ppt-soft: #452c1c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16150f; --surface: #1f1e17; --surface-2: #28261d;
    --text: #f1efe6; --text-secondary: #c2bfb2; --text-muted: #918e80;
    --border: rgba(241,239,230,0.13); --border-strong: rgba(241,239,230,0.24);
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 20px -14px rgba(0,0,0,0.6);
    --accent: #a68af0; --accent-soft: #332a4d;
    --pdf: #e3897c; --pdf-soft: #45241e;
    --ppt: #f0925a; --ppt-soft: #452c1c;
  }
  :root[data-theme="light"] {
    --bg: #f5f5f2; --surface: #ffffff; --surface-2: #eeede6;
    --text: #17160f; --text-secondary: #57554c; --text-muted: #8c897d;
    --border: rgba(23,22,15,0.11); --border-strong: rgba(23,22,15,0.22);
    --shadow: 0 1px 2px rgba(23,22,15,0.04), 0 8px 20px -14px rgba(23,22,15,0.22);
    --accent: #6849c9; --accent-soft: #e6ddf9;
    --pdf: #b0392b; --pdf-soft: #fbe1dc;
    --ppt: #c9540c; --ppt-soft: #f8e2d1;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", "Segoe UI", system-ui, sans-serif;
    line-height: 1.6; font-feature-settings: "palt" 1;
    padding-bottom: 48px;
  }

  header.top {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .top-inner { max-width: 760px; margin: 0 auto; padding: 12px 16px; }
  .top-title { font-size: 11px; letter-spacing: .1em; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
  .top-h1 { font-size: 17px; font-weight: 800; margin: 3px 0 10px; letter-spacing: -0.01em; }

  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 999px;
    padding: 9px 14px; margin-bottom: 10px;
  }
  .search-box svg { flex: none; color: var(--text-muted); }
  .search-box input {
    border: none; outline: none; background: transparent; color: var(--text);
    font: inherit; font-size: 13.5px; width: 100%;
  }
  .search-box input::placeholder { color: var(--text-muted); }

  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 4px; }
  .tag-chip {
    appearance: none; border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--text-secondary); font: inherit; font-size: 11.5px; font-weight: 700;
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .tag-chip[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }

  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 0; }

  /* ---- Carousel ---- */
  .carousel {
    position: relative; border-radius: 16px; overflow: hidden; margin-bottom: 18px;
    box-shadow: var(--shadow); border: 1px solid var(--border);
    background: var(--surface-2);
  }
  .carousel-track { display: flex; transition: transform .6s cubic-bezier(.4,0,.2,1); }
  .carousel-slide {
    flex: none; width: 100%; aspect-ratio: 16 / 7; position: relative;
    text-decoration: none; color: inherit; display: block;
  }
  .carousel-slide .cs-media {
    position: absolute; inset: 0; background-size: cover; background-position: center;
  }
  .carousel-slide .cs-overlay {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 12px;
    background: linear-gradient(to top, rgba(0,0,0,0.72), rgba(0,0,0,0.32) 65%, transparent);
  }
  .carousel-slide .cs-title { font-size: 14px; font-weight: 800; color: #fff; line-height: 1.4; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .carousel-slide .cs-desc { font-size: 11px; color: rgba(255,255,255,0.88); margin-top: 3px; line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .carousel-dots { position: absolute; right: 12px; bottom: 10px; display: flex; gap: 5px; z-index: 2; }
  .carousel-dots span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.45); transition: background .2s, transform .2s; }
  .carousel-dots span.active { background: #fff; transform: scale(1.25); }
  @media (prefers-reduced-motion: reduce) { .carousel-track { transition: none; } }

  .result-count { font-size: 11.5px; color: var(--text-muted); margin-bottom: 12px; }

  .grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column;
  }
  .card-cover { position: relative; width: 100%; aspect-ratio: 16 / 9; background-size: cover; background-position: center; }
  .card-cover .filetype-badge { position: absolute; top: 8px; left: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card-top { display: flex; align-items: flex-start; gap: 10px; }
  .filetype-badge {
    flex: none; width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 800; color: #fff;
  }
  .filetype-badge.pdf { background: var(--pdf); }
  .filetype-badge.pptx { background: var(--ppt); }
  .card-title { font-size: 14px; font-weight: 800; line-height: 1.4; }
  .card-client { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .card-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.7; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .card-tag {
    font-size: 10px; font-weight: 700; color: var(--accent); background: var(--accent-soft);
    padding: 2px 8px; border-radius: 999px;
  }
  .card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 4px; }
  .card-date { font-size: 10px; color: var(--text-muted); }
  .dl-btn {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--accent); color: #fff; text-decoration: none;
    font-size: 11.5px; font-weight: 800; padding: 7px 13px; border-radius: 999px;
  }
  .dl-btn:active { opacity: .8; }

  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 13px; line-height: 1.9;
  }

  footer.pagefoot { max-width: 760px; margin: 30px auto 0; padding: 16px; font-size: 10.5px; color: var(--text-muted); line-height: 1.8; border-top: 1px solid var(--border); }
</style>

<header class="top">
  <div class="top-inner">
    <div class="top-title">Proposal Library</div>
    <h1 class="top-h1">企画ダッシュボード</h1>
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="キーワードで検索（タイトル・クライアント・説明文）">
    </div>
    <div class="tag-row" id="tagRow"></div>
  </div>
</header>

<main>
  <div class="carousel" id="carousel" hidden>
    <div class="carousel-track" id="carouselTrack"></div>
    <div class="carousel-dots" id="carouselDots"></div>
  </div>
  <div class="result-count" id="resultCount"></div>
  <div class="grid" id="grid"></div>
</main>

<footer class="pagefoot">
  社内企画資料ライブラリ。掲載資料の著作権・利用範囲は各案件の契約条件に準じます。
</footer>

<script>
(function () {
  var state = { items: [], activeTags: new Set(), query: '' };

  function fileTypeOf(filename) {
    var ext = filename.split('.').pop().toLowerCase();
    if (ext === 'pdf') return 'pdf';
    if (ext === 'ppt' || ext === 'pptx') return 'pptx';
    return ext;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function hashHue(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return h % 360;
  }

  function coverBgCss(item) {
    if (item.cover) {
      return "background-image:url('" + encodeURI(item.cover) + "')";
    }
    var hue = hashHue(item.id || item.title || '');
    var hue2 = (hue + 40) % 360;
    return 'background-image:linear-gradient(135deg, hsl(' + hue + ',55%,40%), hsl(' + hue2 + ',55%,26%))';
  }

  function renderTags() {
    var tagSet = new Set();
    state.items.forEach(function (it) { (it.tags || []).forEach(function (t) { tagSet.add(t); }); });
    var tagRow = document.getElementById('tagRow');
    tagRow.innerHTML = '';
    Array.from(tagSet).sort().forEach(function (tag) {
      var btn = document.createElement('button');
      btn.className = 'tag-chip';
      btn.type = 'button';
      btn.textContent = tag;
      btn.setAttribute('aria-pressed', state.activeTags.has(tag) ? 'true' : 'false');
      btn.addEventListener('click', function () {
        if (state.activeTags.has(tag)) state.activeTags.delete(tag);
        else state.activeTags.add(tag);
        renderTags();
        renderGrid();
      });
      tagRow.appendChild(btn);
    });
  }

  function matches(item) {
    if (state.activeTags.size > 0) {
      var itemTags = new Set(item.tags || []);
      for (var t of state.activeTags) { if (!itemTags.has(t)) return false; }
    }
    if (state.query) {
      var hay = [item.title, item.client, item.description, (item.tags || []).join(' ')].join(' ').toLowerCase();
      if (hay.indexOf(state.query.toLowerCase()) === -1) return false;
    }
    return true;
  }

  function renderGrid() {
    var filtered = state.items.filter(matches);
    var grid = document.getElementById('grid');
    var countEl = document.getElementById('resultCount');

    if (state.items.length === 0) {
      grid.innerHTML = '';
      countEl.textContent = '';
      grid.innerHTML = '<div class="empty-state">まだ企画資料が登録されていません。<br>担当者に資料の追加を依頼してください。</div>';
      return;
    }

    countEl.textContent = filtered.length + '件 / 全' + state.items.length + '件';

    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty-state">条件に一致する資料が見つかりませんでした。</div>';
      return;
    }

    grid.innerHTML = filtered.map(function (it) {
      var ft = fileTypeOf(it.filename);
      var tagsHtml = (it.tags || []).map(function (t) { return '<span class="card-tag">' + escapeHtml(t) + '</span>'; }).join('');
      return '' +
        '<div class="card">' +
          '<div class="card-cover" style="' + coverBgCss(it) + '">' +
            '<div class="filetype-badge ' + ft + '">' + ft.toUpperCase() + '</div>' +
          '</div>' +
          '<div class="card-body">' +
            '<div class="card-top">' +
              '<div>' +
                '<div class="card-title">' + escapeHtml(it.title) + '</div>' +
                (it.client ? '<div class="card-client">' + escapeHtml(it.client) + '</div>' : '') +
              '</div>' +
            '</div>' +
            (it.description ? '<div class="card-desc">' + escapeHtml(it.description) + '</div>' : '') +
            (tagsHtml ? '<div class="card-tags">' + tagsHtml + '</div>' : '') +
            '<div class="card-foot">' +
              '<span class="card-date">' + escapeHtml(it.dateAdded || '') + '</span>' +
              '<a class="dl-btn" href="' + encodeURI(it.filename) + '" download>' +
                '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
                'ダウンロード' +
              '</a>' +
            '</div>' +
          '</div>' +
        '</div>';
    }).join('');
  }

  document.getElementById('searchInput').addEventListener('input', function (e) {
    state.query = e.target.value;
    renderGrid();
  });

  var carouselTimer = null;
  var carouselIndex = 0;

  function renderCarousel() {
    var wrap = document.getElementById('carousel');
    var track = document.getElementById('carouselTrack');
    var dots = document.getElementById('carouselDots');

    if (carouselTimer) { clearInterval(carouselTimer); carouselTimer = null; }

    if (state.items.length === 0) {
      wrap.hidden = true;
      return;
    }
    wrap.hidden = false;

    var slides = state.items.slice(0, 10);

    track.innerHTML = slides.map(function (it) {
      return '' +
        '<a class="carousel-slide" href="' + encodeURI(it.filename) + '" download>' +
          '<div class="cs-media" style="' + coverBgCss(it) + '"></div>' +
          '<div class="cs-overlay">' +
            '<div class="cs-title">' + escapeHtml(it.title) + '</div>' +
            (it.description ? '<div class="cs-desc">' + escapeHtml(it.description) + '</div>' : '') +
          '</div>' +
        '</a>';
    }).join('');

    dots.innerHTML = slides.map(function (_, i) {
      return '<span data-i="' + i + '"' + (i === 0 ? ' class="active"' : '') + '></span>';
    }).join('');

    carouselIndex = 0;

    function goTo(i) {
      carouselIndex = (i + slides.length) % slides.length;
      track.style.transform = 'translateX(-' + (carouselIndex * 100) + '%)';
      Array.from(dots.children).forEach(function (d, idx) {
        d.classList.toggle('active', idx === carouselIndex);
      });
    }

    Array.from(dots.children).forEach(function (dot) {
      dot.addEventListener('click', function () {
        goTo(parseInt(dot.getAttribute('data-i'), 10));
        resetTimer();
      });
    });

    function resetTimer() {
      if (carouselTimer) clearInterval(carouselTimer);
      if (slides.length > 1) {
        carouselTimer = setInterval(function () { goTo(carouselIndex + 1); }, 3000);
      }
    }

    resetTimer();
  }

  fetch('./data.json?_r=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (data) {
      state.items = (data.items || []).slice().sort(function (a, b) {
        return (b.dateAdded || '').localeCompare(a.dateAdded || '');
      });
      renderTags();
      renderGrid();
      renderCarousel();
    })
    .catch(function () {
      document.getElementById('grid').innerHTML = '<div class="empty-state">データの読み込みに失敗しました。</div>';
    });
})();
</script>
