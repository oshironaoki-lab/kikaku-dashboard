<title>企画ダッシュボード</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    --bg: #f5f5f2;
    --surface: #ffffff;
    --surface-2: #eeede6;
    --text: #17160f;
    --text-secondary: #57554c;
    --text-muted: #8c897d;
    --border: rgba(23,22,15,0.11);
    --border-strong: rgba(23,22,15,0.22);
    --shadow: 0 1px 2px rgba(23,22,15,0.04), 0 8px 20px -14px rgba(23,22,15,0.22);
    --accent: #6849c9; --accent-soft: #e6ddf9;
    --pdf: #b0392b; --pdf-soft: #fbe1dc;
    --ppt: #c9540c; --ppt-soft: #f8e2d1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16150f; --surface: #1f1e17; --surface-2: #28261d;
      --text: #f1efe6; --text-secondary: #c2bfb2; --text-muted: #918e80;
      --border: rgba(241,239,230,0.13); --border-strong: rgba(241,239,230,0.24);
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 20px -14px rgba(0,0,0,0.6);
      --accent: #a68af0; --accent-soft: #332a4d;
      --pdf: #e3897c; --pdf-soft: #45241e;
      --ppt: #f0925a; --ppt-soft: #452c1c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16150f; --surface: #1f1e17; --surface-2: #28261d;
    --text: #f1efe6; --text-secondary: #c2bfb2; --text-muted: #918e80;
    --border: rgba(241,239,230,0.13); --border-strong: rgba(241,239,230,0.24);
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 20px -14px rgba(0,0,0,0.6);
    --accent: #a68af0; --accent-soft: #332a4d;
    --pdf: #e3897c; --pdf-soft: #45241e;
    --ppt: #f0925a; --ppt-soft: #452c1c;
  }
  :root[data-theme="light"] {
    --bg: #f5f5f2; --surface: #ffffff; --surface-2: #eeede6;
    --text: #17160f; --text-secondary: #57554c; --text-muted: #8c897d;
    --border: rgba(23,22,15,0.11); --border-strong: rgba(23,22,15,0.22);
    --shadow: 0 1px 2px rgba(23,22,15,0.04), 0 8px 20px -14px rgba(23,22,15,0.22);
    --accent: #6849c9; --accent-soft: #e6ddf9;
    --pdf: #b0392b; --pdf-soft: #fbe1dc;
    --ppt: #c9540c; --ppt-soft: #f8e2d1;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", "Segoe UI", system-ui, sans-serif;
    line-height: 1.6; font-feature-settings: "palt" 1;
    padding-bottom: 48px;
  }

  header.top {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .top-inner { max-width: 760px; margin: 0 auto; padding: 12px 16px; }
  .top-titlebar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .top-title { font-size: 11px; letter-spacing: .1em; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
  .top-h1 { font-size: 17px; font-weight: 800; margin: 3px 0 10px; letter-spacing: -0.01em; }
  .refresh-btn {
    -webkit-appearance: none; appearance: none; border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--text); font: inherit; font-size: 11.5px; font-weight: 700;
    padding: 6px 12px; border-radius: 999px; cursor: pointer; flex: none; min-height: 30px;
    display: inline-flex; align-items: center; gap: 6px; -webkit-tap-highlight-color: transparent;
    transition: background .15s, transform .15s;
  }
  .refresh-btn:active { transform: scale(.96); }
  .refresh-btn .ic { display: inline-block; transition: transform .5s ease; }
  .refresh-btn.spinning .ic { animation: spin .6s linear; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .refresh-btn.spinning .ic { animation: none; } }

  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 999px;
    padding: 9px 14px; margin-bottom: 10px;
  }
  .search-box svg { flex: none; color: var(--text-muted); }
  .search-box input {
    border: none; outline: none; background: transparent; color: var(--text);
    font: inherit; font-size: 13.5px; width: 100%;
  }
  .search-box input::placeholder { color: var(--text-muted); }

  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 4px; }
  .tag-chip {
    appearance: none; border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--text-secondary); font: inherit; font-size: 11.5px; font-weight: 700;
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .tag-chip[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }

  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 0; }

  /* ---- Carousel ---- */
  .carousel {
    position: relative; border-radius: 16px; overflow: hidden; margin-bottom: 18px;
    box-shadow: var(--shadow); border: 1px solid var(--border);
    background: var(--surface-2);
  }
  .carousel-track { display: flex; transition: transform .6s cubic-bezier(.4,0,.2,1); }
  .carousel-slide {
    appearance: none; border: none; margin: 0; padding: 0; font: inherit; cursor: pointer;
    flex: none; width: 100%; aspect-ratio: 16 / 7; position: relative;
    text-decoration: none; color: inherit; display: block;
  }
  .carousel-slide .cs-media {
    position: absolute; inset: 0; background-color: #fff; background-size: contain; background-repeat: no-repeat; background-position: center;
  }
  .carousel-slide .cs-overlay {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 12px;
    background: linear-gradient(to top, rgba(0,0,0,0.72), rgba(0,0,0,0.32) 65%, transparent);
  }
  .carousel-slide .cs-title { font-size: 14px; font-weight: 800; color: #fff; line-height: 1.4; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .carousel-slide .cs-desc { font-size: 11px; color: rgba(255,255,255,0.88); margin-top: 3px; line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .carousel-dots { position: absolute; right: 12px; bottom: 10px; display: flex; gap: 5px; z-index: 2; }
  .carousel-dots span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.45); transition: background .2s, transform .2s; }
  .carousel-dots span.active { background: #fff; transform: scale(1.25); }
  @media (prefers-reduced-motion: reduce) { .carousel-track { transition: none; } }

  .nav-arrow {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
    width: 32px; height: 32px; border-radius: 50%; border: none;
    background: rgba(0,0,0,0.4); color: #fff; display: flex; align-items: center; justify-content: center;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .nav-arrow:active { background: rgba(0,0,0,0.6); }
  .nav-arrow.prev { left: 8px; }
  .nav-arrow.next { right: 8px; }

  .result-count { font-size: 11.5px; color: var(--text-muted); margin-bottom: 12px; }

  .grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column;
  }
  .card-cover { position: relative; width: 100%; aspect-ratio: 16 / 9; background-color: #fff; background-size: contain; background-repeat: no-repeat; background-position: center; }
  .card-cover .filetype-badge { position: absolute; top: 8px; left: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card-top { display: flex; align-items: flex-start; gap: 10px; }
  .filetype-badge {
    flex: none; width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 800; color: #fff;
  }
  .filetype-badge.pdf { background: var(--pdf); }
  .filetype-badge.pptx { background: var(--ppt); }
  .card-title { font-size: 14px; font-weight: 800; line-height: 1.4; }
  .card-client { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .card-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.7; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .card-tag {
    font-size: 10px; font-weight: 700; color: var(--accent); background: var(--accent-soft);
    padding: 2px 8px; border-radius: 999px;
  }
  .card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 4px; }
  .card-date { font-size: 10px; color: var(--text-muted); }
  .dl-btn {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--accent); color: #fff; text-decoration: none;
    font-size: 11.5px; font-weight: 800; padding: 7px 13px; border-radius: 999px;
  }
  .dl-btn:active { opacity: .8; }

  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 13px; line-height: 1.9;
  }

  .focus-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--accent-soft); border-radius: 10px; padding: 9px 13px; margin-bottom: 12px;
    font-size: 12px; color: var(--accent); font-weight: 700;
  }
  .focus-bar button {
    appearance: none; border: none; background: transparent; color: var(--accent);
    font: inherit; font-weight: 800; font-size: 12px; cursor: pointer; text-decoration: underline;
  }

  .preview-btn {
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-secondary);
    text-decoration: none; font: inherit; font-size: 11.5px; font-weight: 800;
    padding: 7px 13px; border-radius: 999px; cursor: pointer;
  }
  .preview-btn:active { background: var(--surface-2); }
  .card-actions { display: flex; align-items: center; gap: 8px; }

  .delete-link {
    display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px;
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-muted);
    border-radius: 999px; text-decoration: none; flex: none;
  }
  .delete-link:active { background: var(--pdf-soft); color: var(--pdf); }
  .modal-delete {
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-muted);
    text-decoration: none; font: inherit; font-size: 12px; font-weight: 700;
    padding: 11px 13px; border-radius: 999px; flex: none;
  }

  /* ---- Preview modal ---- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10,9,6,0.6); z-index: 100;
    display: flex; align-items: flex-end; justify-content: center;
  }
  @media (min-width: 640px) { .modal-overlay { align-items: center; } }
  .modal-card {
    background: var(--surface); width: 100%; max-width: 560px; max-height: 88vh;
    border-radius: 18px 18px 0 0; overflow-y: auto; box-shadow: 0 20px 60px -20px rgba(0,0,0,.5);
  }
  @media (min-width: 640px) { .modal-card { border-radius: 18px; } }
  .modal-cover {
    width: 100%; aspect-ratio: 16 / 10; background: #fff; position: relative; overflow: hidden;
  }
  .modal-cover img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff;
  }
  .modal-close {
    position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%;
    background: rgba(0,0,0,0.55); color: #fff; border: none; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px; z-index: 4;
  }
  .modal-page-count {
    position: absolute; left: 10px; bottom: 10px; z-index: 3;
    background: rgba(0,0,0,0.55); color: #fff; font-size: 10.5px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px;
  }
  .modal-body { padding: 16px 18px 20px; }
  .modal-title { font-size: 16px; font-weight: 800; line-height: 1.4; }
  .modal-client { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .modal-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.8; margin-top: 10px; }
  .modal-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .modal-foot { margin-top: 16px; display: flex; gap: 8px; }
  .modal-foot .dl-btn { flex: 1; justify-content: center; padding: 11px 13px; font-size: 12.5px; }

  footer.pagefoot { max-width: 760px; margin: 30px auto 0; padding: 16px; font-size: 10.5px; color: var(--text-muted); line-height: 1.8; border-top: 1px solid var(--border); }
</style>

<header class="top">
  <div class="top-inner">
    <div class="top-titlebar">
      <div class="top-title">Proposal Library</div>
      <button class="refresh-btn" id="refreshBtn" type="button" aria-label="最新の公開内容に更新">
        <svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
        <span>更新</span>
      </button>
    </div>
    <h1 class="top-h1">企画ダッシュボード</h1>
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="キーワードで検索（タイトル・クライアント・説明文）">
    </div>
    <div class="tag-row" id="tagRow"></div>
  </div>
</header>

<main>
  <div class="carousel" id="carousel" hidden>
    <div class="carousel-track" id="carouselTrack"></div>
    <button type="button" class="nav-arrow prev" id="carouselPrev" aria-label="前の資料">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button type="button" class="nav-arrow next" id="carouselNext" aria-label="次の資料">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <div class="carousel-dots" id="carouselDots"></div>
  </div>
  <div class="result-count" id="resultCount"></div>
  <div class="grid" id="grid"></div>
</main>

<div id="modalRoot"></div>

<footer class="pagefoot">
  社内企画資料ライブラリ。掲載資料の著作権・利用範囲は各案件の契約条件に準じます。
</footer>

<script>
(function () {
  var state = { items: [], activeTags: new Set(), query: '', focusId: null };

  function fileTypeOf(filename) {
    var ext = filename.split('.').pop().toLowerCase();
    if (ext === 'pdf') return 'pdf';
    if (ext === 'ppt' || ext === 'pptx') return 'pptx';
    return ext;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function hashHue(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return h % 360;
  }

  function deleteMailtoUrl(item) {
    var subject = '企画ダッシュボード 削除依頼: ' + item.title;
    var body = '以下の資料の削除をお願いします。\n\nID: ' + item.id + '\nタイトル: ' + item.title +
      (item.client ? '\nクライアント: ' + item.client : '') + '\n';
    return 'mailto:oshiro.naoki@gmail.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  }

  function coverBgCss(item) {
    if (item.cover) {
      return "background-image:url('" + encodeURI(item.cover) + "')";
    }
    var hue = hashHue(item.id || item.title || '');
    var hue2 = (hue + 40) % 360;
    return 'background-image:linear-gradient(135deg, hsl(' + hue + ',55%,40%), hsl(' + hue2 + ',55%,26%))';
  }

  function renderTags() {
    var tagSet = new Set();
    state.items.forEach(function (it) { (it.tags || []).forEach(function (t) { tagSet.add(t); }); });
    var tagRow = document.getElementById('tagRow');
    tagRow.innerHTML = '';
    Array.from(tagSet).sort().forEach(function (tag) {
      var btn = document.createElement('button');
      btn.className = 'tag-chip';
      btn.type = 'button';
      btn.textContent = tag;
      btn.setAttribute('aria-pressed', state.activeTags.has(tag) ? 'true' : 'false');
      btn.addEventListener('click', function () {
        state.focusId = null;
        if (state.activeTags.has(tag)) state.activeTags.delete(tag);
        else state.activeTags.add(tag);
        renderTags();
        renderGrid();
      });
      tagRow.appendChild(btn);
    });
  }

  function matches(item) {
    if (state.focusId) { return item.id === state.focusId; }
    if (state.activeTags.size > 0) {
      var itemTags = new Set(item.tags || []);
      for (var t of state.activeTags) { if (!itemTags.has(t)) return false; }
    }
    if (state.query) {
      var hay = [item.title, item.client, item.description, (item.tags || []).join(' ')].join(' ').toLowerCase();
      if (hay.indexOf(state.query.toLowerCase()) === -1) return false;
    }
    return true;
  }

  function renderGrid() {
    var filtered = state.items.filter(matches);
    var grid = document.getElementById('grid');
    var countEl = document.getElementById('resultCount');

    if (state.items.length === 0) {
      grid.innerHTML = '';
      countEl.textContent = '';
      grid.innerHTML = '<div class="empty-state">まだ企画資料が登録されていません。<br>担当者に資料の追加を依頼してください。</div>';
      return;
    }

    if (state.focusId) {
      countEl.innerHTML = '';
      var bar = document.createElement('div');
      bar.className = 'focus-bar';
      bar.innerHTML = '<span>カルーセルで選択中の資料を表示しています</span>';
      var clearBtn = document.createElement('button');
      clearBtn.type = 'button';
      clearBtn.textContent = 'すべて表示に戻る';
      clearBtn.addEventListener('click', function () {
        state.focusId = null;
        renderGrid();
      });
      bar.appendChild(clearBtn);
      countEl.appendChild(bar);
    } else {
      countEl.textContent = filtered.length + '件 / 全' + state.items.length + '件';
    }

    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty-state">条件に一致する資料が見つかりませんでした。</div>';
      return;
    }

    grid.innerHTML = filtered.map(function (it) {
      var ft = fileTypeOf(it.filename);
      var tagsHtml = (it.tags || []).map(function (t) { return '<span class="card-tag">' + escapeHtml(t) + '</span>'; }).join('');
      return '' +
        '<div class="card">' +
          '<div class="card-cover" data-preview-id="' + escapeHtml(it.id) + '" style="' + coverBgCss(it) + '; cursor:pointer;">' +
            '<div class="filetype-badge ' + ft + '">' + ft.toUpperCase() + '</div>' +
          '</div>' +
          '<div class="card-body">' +
            '<div class="card-top">' +
              '<div>' +
                '<div class="card-title">' + escapeHtml(it.title) + '</div>' +
                (it.client ? '<div class="card-client">' + escapeHtml(it.client) + '</div>' : '') +
              '</div>' +
            '</div>' +
            (it.description ? '<div class="card-desc">' + escapeHtml(it.description) + '</div>' : '') +
            (tagsHtml ? '<div class="card-tags">' + tagsHtml + '</div>' : '') +
            '<div class="card-foot">' +
              '<span class="card-date">' + escapeHtml(it.dateAdded || '') + '</span>' +
              '<div class="card-actions">' +
                '<button type="button" class="preview-btn" data-preview-id="' + escapeHtml(it.id) + '">' +
                  '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>' +
                  'プレビュー' +
                '</button>' +
                '<a class="dl-btn" href="' + encodeURI(it.filename) + '" download>' +
                  '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
                  'ダウンロード' +
                '</a>' +
                '<a class="delete-link" href="' + deleteMailtoUrl(it) + '" title="削除を依頼する" aria-label="削除を依頼する">' +
                  '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>' +
                '</a>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
    }).join('');

    Array.from(grid.querySelectorAll('[data-preview-id]')).forEach(function (el) {
      el.addEventListener('click', function () {
        var item = state.items.find(function (i) { return i.id === el.getAttribute('data-preview-id'); });
        if (item) openPreview(item);
      });
    });
  }

  function pageImageUrl(item, pageNum) {
    var n = String(pageNum).padStart(3, '0');
    return encodeURI('pages/' + item.id + '/' + n + '.png');
  }

  function openPreview(item) {
    var root = document.getElementById('modalRoot');
    var tagsHtml = (item.tags || []).map(function (t) { return '<span class="card-tag">' + escapeHtml(t) + '</span>'; }).join('');
    var pageCount = item.pageCount || 0;
    var pageNum = 1;

    var coverInner = pageCount > 0
      ? '<img id="modalPageImg" src="' + pageImageUrl(item, 1) + '" alt="' + escapeHtml(item.title) + '">' +
        '<button type="button" class="nav-arrow prev" id="modalPrev" aria-label="前のページ">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>' +
        '</button>' +
        '<button type="button" class="nav-arrow next" id="modalNext" aria-label="次のページ">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>' +
        '</button>' +
        '<div class="modal-page-count" id="modalPageCount">1 / ' + pageCount + '</div>'
      : '<div style="position:absolute;inset:0;' + coverBgCss(item) + ';background-size:contain;background-repeat:no-repeat;background-position:center;"></div>';

    root.innerHTML = '' +
      '<div class="modal-overlay" id="modalOverlay">' +
        '<div class="modal-card">' +
          '<div class="modal-cover">' +
            coverInner +
            '<button type="button" class="modal-close" id="modalClose" aria-label="閉じる">&times;</button>' +
          '</div>' +
          '<div class="modal-body">' +
            '<div class="modal-title">' + escapeHtml(item.title) + '</div>' +
            (item.client ? '<div class="modal-client">' + escapeHtml(item.client) + '</div>' : '') +
            (item.description ? '<div class="modal-desc">' + escapeHtml(item.description) + '</div>' : '') +
            (tagsHtml ? '<div class="modal-tags">' + tagsHtml + '</div>' : '') +
            '<div class="modal-foot">' +
              '<a class="dl-btn" href="' + encodeURI(item.filename) + '" download>' +
                '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
                'ダウンロード' +
              '</a>' +
              '<a class="modal-delete" href="' + deleteMailtoUrl(item) + '">' +
                '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>' +
                '削除依頼' +
              '</a>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    var overlay = document.getElementById('modalOverlay');
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closePreview();
    });
    document.getElementById('modalClose').addEventListener('click', closePreview);
    document.addEventListener('keydown', escCloseHandler);

    if (pageCount > 0) {
      var img = document.getElementById('modalPageImg');
      var countEl = document.getElementById('modalPageCount');
      function showPage(n) {
        pageNum = ((n - 1 + pageCount) % pageCount) + 1;
        img.src = pageImageUrl(item, pageNum);
        countEl.textContent = pageNum + ' / ' + pageCount;
      }
      document.getElementById('modalPrev').addEventListener('click', function () { showPage(pageNum - 1); });
      document.getElementById('modalNext').addEventListener('click', function () { showPage(pageNum + 1); });
      pageKeyHandler = function (e) {
        if (e.key === 'ArrowLeft') showPage(pageNum - 1);
        if (e.key === 'ArrowRight') showPage(pageNum + 1);
      };
      document.addEventListener('keydown', pageKeyHandler);
    }
  }

  var pageKeyHandler = null;

  function escCloseHandler(e) {
    if (e.key === 'Escape') closePreview();
  }

  function closePreview() {
    document.getElementById('modalRoot').innerHTML = '';
    document.removeEventListener('keydown', escCloseHandler);
    if (pageKeyHandler) { document.removeEventListener('keydown', pageKeyHandler); pageKeyHandler = null; }
  }

  document.getElementById('searchInput').addEventListener('input', function (e) {
    state.focusId = null;
    state.query = e.target.value;
    renderGrid();
  });

  var carouselTimer = null;
  var carouselIndex = 0;

  function renderCarousel() {
    var wrap = document.getElementById('carousel');
    var track = document.getElementById('carouselTrack');
    var dots = document.getElementById('carouselDots');

    if (carouselTimer) { clearInterval(carouselTimer); carouselTimer = null; }

    if (state.items.length === 0) {
      wrap.hidden = true;
      return;
    }
    wrap.hidden = false;

    var slides = state.items.slice(0, 10);

    track.innerHTML = slides.map(function (it) {
      return '' +
        '<button type="button" class="carousel-slide" data-focus-id="' + escapeHtml(it.id) + '">' +
          '<div class="cs-media" style="' + coverBgCss(it) + '"></div>' +
          '<div class="cs-overlay">' +
            '<div class="cs-title">' + escapeHtml(it.title) + '</div>' +
            (it.description ? '<div class="cs-desc">' + escapeHtml(it.description) + '</div>' : '') +
          '</div>' +
        '</button>';
    }).join('');

    Array.from(track.children).forEach(function (slideEl) {
      slideEl.addEventListener('click', function () {
        state.focusId = slideEl.getAttribute('data-focus-id');
        state.query = '';
        document.getElementById('searchInput').value = '';
        state.activeTags.clear();
        renderTags();
        renderGrid();
        document.getElementById('resultCount').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });

    dots.innerHTML = slides.map(function (_, i) {
      return '<span data-i="' + i + '"' + (i === 0 ? ' class="active"' : '') + '></span>';
    }).join('');

    carouselIndex = 0;

    function goTo(i) {
      carouselIndex = (i + slides.length) % slides.length;
      track.style.transform = 'translateX(-' + (carouselIndex * 100) + '%)';
      Array.from(dots.children).forEach(function (d, idx) {
        d.classList.toggle('active', idx === carouselIndex);
      });
    }

    Array.from(dots.children).forEach(function (dot) {
      dot.addEventListener('click', function () {
        goTo(parseInt(dot.getAttribute('data-i'), 10));
        resetTimer();
      });
    });

    document.getElementById('carouselPrev').addEventListener('click', function () {
      goTo(carouselIndex - 1);
      resetTimer();
    });
    document.getElementById('carouselNext').addEventListener('click', function () {
      goTo(carouselIndex + 1);
      resetTimer();
    });

    function resetTimer() {
      if (carouselTimer) clearInterval(carouselTimer);
      if (slides.length > 1) {
        carouselTimer = setInterval(function () { goTo(carouselIndex + 1); }, 3000);
      }
    }

    resetTimer();
  }

  fetch('./data.json?_r=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (data) {
      state.items = (data.items || []).slice().sort(function (a, b) {
        return (b.dateAdded || '').localeCompare(a.dateAdded || '');
      });
      renderTags();
      renderGrid();
      renderCarousel();
    })
    .catch(function () {
      document.getElementById('grid').innerHTML = '<div class="empty-state">データの読み込みに失敗しました。</div>';
    });

  var refreshBtn = document.getElementById('refreshBtn');
  if (refreshBtn) {
    refreshBtn.addEventListener('click', function () {
      refreshBtn.classList.add('spinning');
      refreshBtn.disabled = true;
      var unloaded = false;
      window.addEventListener('pagehide', function () { unloaded = true; });
      setTimeout(function () {
        if (unloaded) return;
        refreshBtn.classList.remove('spinning');
        refreshBtn.disabled = false;
        var note = document.getElementById('refreshFailNote');
        if (!note) {
          note = document.createElement('div');
          note.id = 'refreshFailNote';
          note.style.cssText = 'font-size:10.5px;color:var(--bad);width:100%;margin-top:6px;';
          note.textContent = '自動更新に失敗しました。ブラウザでこのページを閉じてから、リンクを開き直してください。';
          refreshBtn.closest('.top-titlebar').appendChild(note);
        }
      }, 1500);
      var url = new URL(location.href);
      url.searchParams.set('_r', Date.now());
      try {
        if (window.top && window.top !== window.self) {
          window.top.location.href = url.toString();
          return;
        }
      } catch (e) {}
      location.replace(url.toString());
    });
  }
})();
</script>
